# Builds Gabe for Mac (Apple silicon): Gabe.app as Gabe.dmg and Gabe-mac.zip.
# Every push to main replaces the files on the "mac-latest" release, which install.sh and installed
# copies (gabe/updater.py) download. A v* tag also attaches Gabe.dmg to that version's release.
#
# Optional secrets:
#   GOOGLE_OAUTH_CLIENT_JSON       Sign in with Google
#   MACOS_CERT_P12, MACOS_CERT_PASSWORD
#                                  the signing identity, base64 .p12. Use "Gabe Local Signing"
#                                  (packaging/macos/upload_signing_cert.sh) so updates keep Gabe's
#                                  Keychain and notification permissions, or a Developer ID.
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#                                  notarize (Developer ID only): the .dmg then opens with no warning.
name: Mac app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,gmail,build]"

      - name: Google OAuth client (optional)
        if: ${{ env.GOOGLE_OAUTH_CLIENT_JSON != '' }}
        run: printf '%s' "$GOOGLE_OAUTH_CLIENT_JSON" > packaging/google_oauth_client.json

      - name: Signing identity (optional)
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KP="$(openssl rand -hex 16)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/id.p12"
          ID="$(security find-identity -p codesigning "$KC" | awk -F'"' 'NR==1 {print $2}')"
          [ -n "$ID" ] || { echo "No signing identity in MACOS_CERT_P12"; exit 1; }
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"

      - name: Build
        env:
          PYTHON: python
          INSTALL: "0"
          GABE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}  # what installed copies compare with GitHub
          GABE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
        run: sh packaging/macos/build.sh

      - name: Notarize (optional)
        if: ${{ env.APPLE_ID != '' && startsWith(env.SIGN_ID, 'Developer ID') }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/macos/Gabe.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/macos/Gabe.dmg
          xcrun stapler staple dist/macos/Gabe.app
          rm dist/macos/Gabe-mac.zip && ditto -c -k --keepParent dist/macos/Gabe.app dist/macos/Gabe-mac.zip

      - name: Smoke test
        run: |
          export GABE_HOME="$RUNNER_TEMP/gabe-home"
          dist/macos/Gabe.app/Contents/MacOS/Gabe check || true
          test -f "$GABE_HOME/config/gabe.yaml" || { echo "Gabe check didn't create its config"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Gabe-mac
          path: |
            dist/macos/Gabe.dmg
            dist/macos/Gabe-mac.zip

      - name: Publish to mac-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF' > dist/macos/build.json
          import json, subprocess, os
          log = lambda f: subprocess.run(["git", "log", "-1", f"--format={f}"], capture_output=True, text=True).stdout.strip()
          print(json.dumps({"sha": os.environ["GITHUB_SHA"], "message": log("%s"), "date": log("%cI")}))
          EOF
          gh release view mac-latest >/dev/null 2>&1 || gh release create mac-latest --prerelease \
            --title "Gabe for Mac (latest)" --target "$GITHUB_SHA" \
            --notes "Install: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh"
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/mac-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null || true
          gh release upload mac-latest dist/macos/Gabe-mac.zip dist/macos/Gabe.dmg --clobber
          gh release upload mac-latest dist/macos/build.json --clobber   # last: tells installed copies the files are ready

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/macos/Gabe.dmg --clobber || gh release create "${{ github.ref_name }}" dist/macos/Gabe.dmg --generate-notes
