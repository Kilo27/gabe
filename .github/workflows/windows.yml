# Builds Gabe for Windows: Gabe.exe (the app folder) and GabeSetup.exe (the installer).
# The files are on the run's page under Artifacts. A v* tag also attaches GabeSetup.exe to a release.
# Installed copies update themselves from the newest successful build of main (gabe/updater.py).
name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,gmail,build]"

      - name: Google OAuth client (optional)
        if: ${{ env.GOOGLE_OAUTH_CLIENT_JSON != '' }}
        shell: pwsh
        run: Set-Content -Path packaging\google_oauth_client.json -Value $env:GOOGLE_OAUTH_CLIENT_JSON -NoNewline
        # Without it the build still works; "Sign in with Google" just isn't available.

      - name: Build
        shell: pwsh
        env:
          PYTHON: python
          GABE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}  # what installed copies compare with GitHub
          GABE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
        run: ./packaging/windows/build.ps1

      - name: Smoke test
        shell: pwsh
        run: |
          $env:GABE_HOME = "$env:RUNNER_TEMP\gabe-home"
          $p = Start-Process dist\windows\Gabe\Gabe.exe -ArgumentList check -Wait -PassThru -NoNewWindow
          if (-not (Test-Path "$env:GABE_HOME\config\gabe.yaml")) { throw "Gabe.exe check didn't create its config (exit $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: GabeSetup
          path: dist/windows/GabeSetup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Gabe-portable
          path: dist/windows/Gabe/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/windows/GabeSetup.exe --clobber || gh release create "${{ github.ref_name }}" dist/windows/GabeSetup.exe --generate-notes
