[project]
name = "gabe"
version = "0.1.0"
description = "Gabe: an agentic chief-of-staff harness for automating admin and management work."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.13",
    "pyyaml>=6.0",
    "httpx>=0.27",  # local (OpenAI-compatible) model provider
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gabe = "gabe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gabe*"]
