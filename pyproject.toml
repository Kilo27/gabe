[project]
name = "gabe"
version = "0.1.0"
description = "Gabe: an agentic chief-of-staff harness for automating admin and management work."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.13",
    "pyyaml>=6.0",
    "httpx>=0.27",  # local (OpenAI-compatible) model provider
]

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=2,<3"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
desktop = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pywebview>=6", "keyring>=25", "mcp>=2,<3",
           "pyobjc-framework-UserNotifications>=11; sys_platform == 'darwin'"]
build = ["pyinstaller>=6.16"]
mcp = ["mcp>=2,<3"]  # MCP servers as integrations
gmail = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]

[project.scripts]
gabe = "gabe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gabe*"]

[tool.setuptools.package-data]
"gabe.web" = ["static/**/*"]
"gabe" = ["defaults/*.yaml"]
