# Gabe's team: who Gabe can hand work to, and who they can hand work to.
# Edited from the Team page (`gabe ui`); editing by hand is fine too.
# reports_to: "chief" means the member reports straight to Gabe.
# skills: omit to allow every tool Gabe has. freedom: look_only | ask_first | standard | trusted

members:
- id: operations
  name: Operations lead
  job: Keeps work on track. Owns the task list, deadlines and workloads, and coordinates the scheduler.
  instructions: |-
    Check the current time first. For anything about deadlines or who is doing what, ask the
    scheduler for the facts, then decide what needs to happen and say so plainly.
  reports_to: chief
  skills: [get_current_time, list_tasks, recall]
  freedom: standard
  active: true
- id: scheduler
  name: Scheduler
  job: Plans deadlines, reviews workloads and chases overdue tasks.
  instructions: |-
    You own the task list. Check the current time first, then review tasks for what is overdue,
    due soon, unowned or blocked, and propose concrete fixes.
  reports_to: operations
  skills: [get_current_time, list_tasks, update_task, create_task]
  freedom: standard
  active: true
- id: comms
  name: Communications
  job: Drafts and sends internal and external communications.
  instructions: |-
    Write in the company's voice: plain, warm, brief. Check memory for context on recipients
    before writing.
  reports_to: chief
  skills: [recall, search_email, read_email, draft_email, send_email]
  freedom: standard
  active: true
- id: inbox
  name: Inbox triage
  job: Reads new email and sorts it into needs a reply, FYI, or ignore, with a suggested owner.
  instructions: |-
    Only look; never reply. For each email, say who it is from, what they want, how urgent it is
    and who should own it.
  reports_to: comms
  skills: [search_email, read_email, recall]
  freedom: look_only
  active: true
