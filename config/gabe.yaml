# Gabe company configuration. Copy and adapt per company; nothing company-specific
# belongs in Gabe's code. Paths are relative to this file.

assistant:
  name: Gabe
  # With delegates configured, Gabe only uses these tools itself and hands everything
  # else to a specialist below. Make sure every other tool belongs to some delegate.
  own_tools: [get_current_time, recall]

company:
  name: Example Co
  timezone: Europe/Dublin
  profile: |
    Example Co is a 40-person software company. Leadership: Alex (CEO), Sam (COO),
    Jordan (Head of Engineering). Weekly leadership meeting is Monday 10:00.
  # Any other key/value pairs here are shown to Gabe as company facts.
  working_hours: "Mon-Fri 09:00-17:30"

# Model backend. Today: Anthropic API. Later: a local GLM server.
provider:
  kind: anthropic
  model: claude-opus-5-5
  effort: high            # low | medium | high | xhigh | max
  refusal_fallback: true  # re-run a declined turn on a fallback model server-side
# provider:
#   kind: openai_compatible
#   base_url: http://gpu-box.local:8000/v1   # vLLM / SGLang serving GLM
#   model: glm-5.3
#   max_tokens: 8192

data_dir: ../data
playbooks_dir: playbooks

# Built-ins by short name; company-specific ones by dotted module path,
# e.g. `- name: acme_gabe.hubspot` with its own settings.
integrations:
  - core
  - memory
  - tasks
  - name: email
    settings:
      backend: gmail       # gmail | outbox (outbox writes to data/email/outbox, sends nothing)
      credentials_file: gmail_client_secret.json   # OAuth client from Google Cloud; see docs/GMAIL_SETUP.md

# What may run unattended. Decisions: allow | ask | deny.
policy:
  defaults:
    read: allow
    write: allow
    external: ask
  tools: {}                # e.g. {send_email: deny}
  integrations: {}         # e.g. {email: ask}

# Daily briefing: `gabe brief` runs it now; `gabe schedule` runs it at this time.
# The agent writing it is read-only; the finished brief is then emailed to `email_to`.
briefing:
  time: "08:00"            # company timezone
  days: [mon, tue, wed, thu, fri]
  email_to: [me]           # "me" = the connected Gmail mailbox; add other addresses as needed
  # output_dir: ../data/briefings

# Specialists Gabe hands work to. `tools` limits what each one can use; omit it to
# give a specialist every tool.
delegates:
  scheduler:
    description: Plans deadlines, reviews workloads and chases overdue tasks.
    instructions: |
      You own the task list. Check the current time first, then review tasks for
      what is overdue, due soon, unowned or blocked, and propose concrete fixes.
    tools: [get_current_time, list_tasks, update_task, create_task]
  comms:
    description: Drafts and sends internal and external communications.
    instructions: |
      Write in the company's voice: plain, warm, brief. Check memory for context on
      recipients before writing.
    tools: [recall, search_email, read_email, draft_email, send_email, mark_email_read]
  notes:
    description: Keeps the record of decisions, commitments, preferences and people.
    instructions: |
      Save what you're given as clear, self-contained notes with good topics and tags.
      Check for an existing note first; update it by forgetting the stale one rather
      than saving a duplicate. When asked what's known about something, search broadly.
    tools: [get_current_time, remember, recall, forget]
