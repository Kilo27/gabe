# Gabe settings. Edit these in the app (Settings); this file is kept in sync.
assistant:
  name: Gabe

company:
  name: Your company
  timezone: Europe/Dublin
  profile: |
    Who's who, roles, and regular meetings. Gabe reads this.

provider:
  kind: anthropic
  model: claude-opus-5-5
  effort: high
  refusal_fallback: true

data_dir: ../data
playbooks_dir: playbooks

integrations:
  - core
  - memory
  - tasks
  - name: email
    settings:
      backend: gmail
      credentials_file: gmail_client_secret.json

policy:
  defaults:
    read: allow
    write: allow
    external: ask
  tools: {}
  integrations: {}

briefing:
  time: "08:00"
  days: [mon, tue, wed, thu, fri]
  email_to: [me]

delegates:
  scheduler:
    description: Plans deadlines, reviews workloads and chases overdue tasks.
    instructions: |
      You own the task list. Check the current time first, then review tasks for
      what is overdue, due soon, unowned or blocked, and propose concrete fixes.
    tools: [get_current_time, list_tasks, update_task, create_task]
  comms:
    description: Drafts and sends internal and external communications.
    instructions: |
      Write in the company's voice: plain, warm, brief. Check memory for context on
      recipients before writing.
    tools: [recall, search_email, read_email, draft_email, send_email]
