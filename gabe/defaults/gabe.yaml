# Gabe settings. Edit these in the app (Settings); this file is kept in sync.
assistant:
  name: Gabe
  own_tools: [get_current_time, recall]   # Gabe hands everything else to the team

company:
  name: Your company
  timezone: Europe/Dublin
  profile: |
    Who's who, roles, and regular meetings. Gabe reads this.

provider:
  kind: anthropic
  model: claude-opus-5-5
  effort: high
  refusal_fallback: true

data_dir: ../data
playbooks_dir: playbooks

integrations:
  - core
  - memory
  - tasks
  - name: email
    settings:
      backend: gmail
      credentials_file: gmail_client_secret.json
  - name: calendar
    settings:
      backend: google      # google | local (practice: nobody is invited)
  - claude_code            # Gabe can change its own setup via Claude Code, with your OK (if installed)
  # FAQ bot: answers customers' questions in Slack from FAQ documents you upload
  # (Settings → FAQ bot, or drop .txt/.md/.docx/.csv/.json files in faq/). See docs/FAQ_BOT.md.
  # Each answer is the `reply_on_slack` action: "ask" (the default for outside actions) queues
  # it in Approvals; set policy.tools.reply_on_slack: allow to post straight away.
  # - name: faq
  #   settings:
  #     folder: faq
  #     model: haiku            # haiku | sonnet | opus
  #     tone: Friendly and brief.
  #     where_to_look: "Help centre: https://help.example.com"   # where to point people the FAQ can't help
  #     slack:
  #       enabled: true         # tokens: SLACK_BOT_TOKEN / SLACK_APP_TOKEN (the app keeps them in the keychain)
  #       channels: []          # empty: every channel the bot has been added to
  #       answer: everyone      # everyone | external (guests and people from other workspaces)
  #       staff: []             # Slack member IDs that are never answered
  #       unanswered: {notify_channel: "#support-team", create_task: true, task_owner: Support}
  # Your own Slack (Settings → Slack, docs/SLACK.md): DMs, group DMs and chosen channels feed the
  # daily brief, and what people ask of you becomes tasks. Token: SLACK_USER_TOKEN (keychain in the app).
  # - name: slack
  #   settings:
  #     direct_messages: true
  #     channels: ["#leadership"]
  #     every_minutes: 15
  #     note_tasks: true          # follows the create_task approval rule
  # MCP servers (tools become <server>__<tool>; external unless set otherwise):
  # - name: mcp
  #   settings:
  #     call_timeout: 60
  #     connect_timeout: 30   # raise for a first `npx -y` download
  #     servers:
  #       notion:
  #         command: npx
  #         args: ["-y", "@notionhq/notion-mcp-server"]
  #         env: {PATH: "/opt/homebrew/bin:/usr/bin:/bin", NOTION_TOKEN: "${NOTION_TOKEN}"}   # the app's PATH is minimal
  #       linear:
  #         url: https://mcp.linear.app/mcp
  #         headers: {Authorization: "Bearer ${LINEAR_TOKEN}"}

policy:
  defaults:
    read: allow
    write: allow
    external: ask
  tools: {}
  integrations: {}

briefing:
  time: "08:00"
  days: [mon, tue, wed, thu, fri]
  email_to: [me]

# Gabe's team: who Gabe hands work to (edit on the Agents screen).
team_file: team.yaml
